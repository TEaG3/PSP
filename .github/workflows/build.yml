name: Build PSP EBOOT

on:
  push:
    branches:
      - main
      - feature/arabic-localization
      - feature/re4-gameplay-systems
  pull_request:
    branches:
      - main
      - feature/arabic-localization
      - feature/re4-gameplay-systems
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate original low-poly game assets (Python)
        run: python3 tools/generate_prototype_assets.py

      - name: Validate generated 3D assets (Python)
        run: python3 tools/validate_assets.py

      - name: Run gameplay unit tests
        run: |
          gcc -std=c99 -O2 -Wall -Wextra -Werror gameplay.c tests/gameplay_test.c -lm -o /tmp/gameplay-test
          /tmp/gameplay-test
          gcc -std=c99 -O2 -Wall -Wextra -Werror tests/arabic_shaper_test.c -o /tmp/arabic-shaper-test
          /tmp/arabic-shaper-test

      - name: Download stb_image.h
        run: curl -fsSL https://raw.githubusercontent.com/nothings/stb/master/stb_image.h -o stb_image.h

      - name: Build with PSPDEV
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            pspdev/pspdev:latest \
            sh -c 'export PSPDEV=/usr/local/pspdev; export PATH="$PSPDEV/bin:$PATH"; make clean; make check-deps; make'

      - name: Upload EBOOT.PBP
        uses: actions/upload-artifact@v4
        with:
          name: RE4Proto-EBOOT
          path: |
            EBOOT.PBP
            assets/
          if-no-files-found: error
